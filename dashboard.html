<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BunkBalance | Attendance Tracker</title>
    <link rel="stylesheet" href="styles.css?v=2" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=2"></script>
    <script src="app.js?v=8" defer></script>
  </head>
  <body>
    <main class="app-shell ready">
      <section class="content" id="top">
        <header class="topbar"><div><div class="brand-wordmark">BunkBalance</div><h1 id="greeting">Good morning.</h1></div><button class="avatar" id="logout-button" type="button" aria-label="Sign out">M</button></header>
        <div class="page-heading"><div><span class="eyebrow">Your semester at a glance</span><h2>Keep showing up.</h2></div><button class="quiet-button" id="add-teacher-button" type="button"><span>+</span> Add teacher</button></div>
        <section class="section-block" id="teachers"><div class="section-heading"><div><span class="eyebrow">Your faculty</span><h3>Teachers & subjects</h3></div><span class="section-count" id="teacher-count">0 teachers</span></div><div class="teacher-grid" id="teacher-grid"></div></section>
        <section class="section-block tasks-section" id="tasks"><div class="section-heading"><div><span class="eyebrow">What still needs doing</span><h3>Remaining assignments</h3></div><div class="section-actions"><span class="section-count" id="task-count">0 remaining</span><button class="text-button" id="add-task-button" type="button">+ Add assignment</button></div></div><div class="task-list" id="task-list"></div></section>
      </section>
    </main>
    <div class="modal-backdrop" id="teacher-modal" hidden><form class="modal" id="teacher-form"><button class="modal-close" type="button" data-close-modal aria-label="Close">×</button><span class="eyebrow">New faculty member</span><h2>Add a teacher</h2><label>Name<input name="name" required placeholder="e.g. Dr. Nadia Iftikhar" /></label><label>Subject<input name="subject" required placeholder="e.g. Fundamentals of Accounting" /></label><label>Semester classes<input name="semester_classes" type="number" min="1" max="200" required placeholder="42" /></label><label>Room or note<input name="room" placeholder="e.g. 1st Floor · Class LR-113" /></label><button class="primary-button" type="submit">Add teacher</button></form></div>
    <div class="modal-backdrop" id="task-modal" hidden><form class="modal" id="task-form"><button class="modal-close" type="button" data-close-modal aria-label="Close">×</button><span class="eyebrow">New reminder</span><h2>Add a task</h2><label>Task<input name="title" required placeholder="e.g. Submit lab report" /></label><label>Teacher<select name="teacher" id="task-teacher-select"></select></label><label>Due date<input name="due" type="date" required /></label><button class="primary-button" type="submit">Add task</button></form></div>
    <div class="modal-backdrop" id="teacher-detail-modal" hidden><section class="modal teacher-detail"><button class="modal-close" type="button" data-close-modal aria-label="Close">×</button><span class="eyebrow">Teacher detail</span><h2 id="detail-name"></h2><p class="detail-subject" id="detail-subject"></p><p class="teacher-room" id="detail-room"></p><div class="detail-attendance"><span class="eyebrow">Mark today's class</span><div><button class="attendance-button present" id="detail-present" type="button">✓ Present</button><button class="attendance-button absent" id="detail-absent" type="button">× Absent</button></div></div><button class="primary-button" id="detail-add-task" type="button">Add a task for this teacher</button></section></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
