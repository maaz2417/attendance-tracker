<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BunkBalance | Attendance Tracker</title>
    <link rel="stylesheet" href="styles.css?v=2" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=2"></script>
    <script src="auth.js?v=1" defer></script>
  </head>
  <body>
    <section class="auth-screen" id="auth-screen">
      <div class="auth-panel">
        <h1 class="brand-wordmark">BunkBalance</h1>
        <h2 id="auth-title">Welcome back.</h2>
        <p class="auth-intro" id="auth-intro">Sign in to keep your attendance and assignments synced.</p>
        <form id="auth-form" class="auth-form" method="post" action="/">
          <label>Email<input name="email" type="email" autocomplete="email" required placeholder="you@example.com" /></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters" /></label>
          <button class="primary-button" id="auth-submit" type="submit">Sign in</button>
        </form>
        <button class="text-button auth-toggle" id="auth-toggle" type="button">Create an account</button>
        <p class="auth-message" id="auth-message" role="status"></p>
      </div>
    </section>
  </body>
</html>
